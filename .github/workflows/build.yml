name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [build-pre-rel]
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build release
        run: bun .\cmd\build.ts -release

      - name: Upload SumatraPDF.exe
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-x64
          path: out/rel64/SumatraPDF.exe
          if-no-files-found: error
